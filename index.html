<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwacha Escrow — Secure USDT P2P Trading in Malawi</title>
  <meta name="description" content="Buy and sell USDT securely in Malawi. Escrow-protected P2P trading with mobile money, bank transfer, and cash support." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    window.__errors = [];
    window.addEventListener('error', function(e) {
      window.__errors.push({
        message: e.message,
        filename: e.filename,
        line: e.lineno,
        col: e.colno,
        error: e.error ? e.error.stack : null
      });
    });
    window.addEventListener('unhandledrejection', function(e) {
      window.__errors.push({
        type: 'unhandledrejection',
        reason: e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e)
      });
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
